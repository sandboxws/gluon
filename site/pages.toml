# The documentation site. site/ is what is written; docs/ is what GitHub Pages
# serves, from main's /docs, and `just docs` renders the one into the other.
# Pages are listed here and never globbed, so nothing in site/ reaches the
# site unless it is named below.

[site]
base_url = "https://sandboxws.github.io/gluon/"
repo = "https://github.com/sandboxws/gluon"
release = "0.1.0"
# Whether the install line and the source link are rendered. They name the
# repository, so a private checkout of the site leaves them out entirely.
public = true

# The guides: written by hand, each command worked through on its page.

[[page]]
path = "guide/index.html"
source = "guide/index.html"
title = "Guides"
eyebrow = "Using gluon"
lead = "Every feature of gluon a task at a time, with a session to type along with."
section = "Guides"
layout = true

[[page]]
path = "guide/start.html"
source = "guide/start.html"
title = "The first five minutes"
eyebrow = "Guide 01"
lead = "Install gluon, type Go, and read what comes back: a value with the truth attached, it and _N, errors that name your line, and help for every command."
section = "Guides"
layout = true

[[page]]
