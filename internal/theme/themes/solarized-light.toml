# Solarized Light, converted from VS Code's own build of it by `gluon theme
# import`.
#
# See solarized-dark.toml. The eight accents are the same values, which is
# Solarized's whole design and not an oversight here; the greys invert.
#
# Re-run:  gluon theme import <file> --print
#          github.com/microsoft/vscode, extensions/theme-solarized-light/themes/solarized-light-color-theme.json
#
# Kept from gluon's own go-light, because nothing in an editor theme means
# them: `note`, `dim`, `search`.
about      = "Solarized Light: the same eight accents, read on paper"
appearance = "light"
source     = "Solarized Light, a VS Code theme"

[theme]
# Source.
keyword     = "#859900"
string      = "#2AA198"
type        = "#CB4B16"
comment     = "#93A1A1"
number      = "#D33682"
builtin     = "#268BD2"
punctuation = "#657B83"
ident       = "#657B83"

# Values, the REPL, and the CLI.
error       = "#DC322F"
prompt      = "#CB4B16"
mode        = "#268BD2"  # solarized blue, against solarized orange
annotation  = "#93A1A1"
note        = "#92400E"
dim         = "#6E6E76"
search      = "#9A3412"
border      = "#DDD6C1"
